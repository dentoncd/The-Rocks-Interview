<!DOCTYPE html>
<html>
    <head>
        <title>Rocks Interview</title>
        <link rel="icon" type="image/x-icon" href="/images/stone-favicon.webp">
        <script src="/scripts/formRocks.js"></script>
        
        <style>
            * {
                font-size: 1.15em;
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            }

            body {
                background-color: darkgray;
            }

            h1 {
                font-size: 40px;
            }

            #moissaniteMsg {
                display: none;
                animation-name: moisAnimate;
                animation-duration: 5s;
                animation-iteration-count: infinite;
            }

            @keyframes moisAnimate {
                0% {color: rgb(199, 255, 245);}
                25% {color: rgb(199, 255, 227);}
                50% {color: rgb(199, 232, 255);}
                75% {color: rgb(222, 199, 255);}
                100% {color: rgb(199, 255, 245);}
            }

            #rockCountContainer {
                display: none;
            }

            fieldset, legend {
                background-color: gray;
                border: 3px solid black;
                padding: 10px;
                margin: 10px;
            }

            label {
                padding: 10px;
            }

            #errorContainer {
                color: rgb(219, 16, 16);
            }
        </style>
    </head>
    <body>
        <h1>Rock Interview &#129704;</h1>
        <form>
            <fieldset>
                <legend>Personal Info</legend>
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname"> 
                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname"> 
                <br>
                <label for="age">Age:</label> 
                <input type="text" id="age" name="age">
                <label for="nickName">Nickname:</label> 
                <input type="text" id="nickName" name="nickName"> 
                <br>
                <label for="petRock">Pet Rock's Name:</label>
                <input type="text" id="petRock" name="petRock">
                <input type="checkbox" id="sameName">
                <label for="sameName">Same as your nickname?</label>
            </fieldset>
            <br>
            <fieldset>
                <legend>The Big Question</legend>
                <label for="questions">Favorite Rock?</label>
                <select id="questions" name="questions">
                    <option>Granite</option>
                    <option>Marble</option>
                    <option>Moissanite</option>
                    <option>Pumice</option>
                    <option>Obsidian</option>
                </select>
                <span id="rockCountContainer">
                <label for="rockCount">How many rocks do you own:</label> 
                <input type="number" id="rockCount" name="rockCount">
                </span>
                <span id="moissaniteMsg">
                    &nbsp;&nbsp; YOU KNOW THIS ONE?? YOU'RE HIRED!!!
                </span>
            </fieldset>
            <br>
            <input type="submit" id="submitBtn" value="Submit">
            <input type="reset" id="reset" value="Reset">
        </form>
        <div id="errorContainer">
            
        </div>
    </body>
</html>
